<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basic Chinese Words</title>
  <style>
    :root {
      --ink: #2b1d1a;
      --paper: #f7f2e8;
      --red: #b3261e;
      --jade: #2f6b57;
      --line: #d9cfbd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding: 1.5rem 1rem;
    }
    main { width: 100%; max-width: 26rem; }
    h1 { font-size: 1.5rem; margin: 0 0 1rem; }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    button, select {
      font: inherit;
      padding: 0.5rem 0.9rem;
      border: 2px solid var(--ink);
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }
    button.active { background: var(--ink); color: var(--paper); }
    button:focus-visible, select:focus-visible, .card:focus-visible {
      outline: 3px solid var(--red);
      outline-offset: 2px;
    }
    .card {
      width: 100%;
      min-height: 15rem;
      border: 2px solid var(--ink);
      border-radius: 10px;
      background: #fffdf8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      cursor: pointer;
    }
    .hanzi {
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      font-size: 4.5rem;
      line-height: 1.1;
    }
    .pinyin { font-size: 1.5rem; color: var(--red); margin-top: 0.5rem; min-height: 2rem; }
    .english { font-size: 1.4rem; margin-top: 0.75rem; min-height: 2rem; }
    .hint { font-size: 0.9rem; color: #6b5d55; margin-top: 1rem; }
    .progress { text-align: center; margin: 0.75rem 0; color: #6b5d55; }
    .nav { display: flex; justify-content: space-between; gap: 0.5rem; }
    .options { display: grid; gap: 0.5rem; margin-top: 1rem; }
    .options button { text-align: left; background: #fffdf8; }
    .options button.right { background: var(--jade); border-color: var(--jade); color: #fff; }
    .options button.wrong { background: var(--red); border-color: var(--red); color: #fff; }
    .score { text-align: center; margin: 0.75rem 0; font-weight: 600; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Basic Chinese Words</h1>

    <div class="row">
      <button id="tab-cards" class="active">Flashcards</button>
      <button id="tab-quiz">Quiz</button>
      <select id="category" aria-label="Word group"></select>
    </div>

    <section id="cards">
      <div id="card" class="card" tabindex="0" role="button" aria-label="Flip card">
        <div class="hanzi" id="c-hanzi"></div>
        <div class="pinyin" id="c-pinyin"></div>
        <div class="english" id="c-english"></div>
        <div class="hint" id="c-hint">Tap the card to see the answer</div>
      </div>
      <div class="progress" id="progress"></div>
      <div class="nav">
        <button id="prev">Previous</button>
        <button id="shuffle">Shuffle</button>
        <button id="next">Next</button>
      </div>
    </section>

    <section id="quiz" hidden>
      <div class="card" style="cursor: default;">
        <div class="hanzi" id="q-hanzi"></div>
        <div class="pinyin" id="q-pinyin"></div>
        <div class="hint">What does this mean?</div>
      </div>
      <div class="options" id="options"></div>
      <div class="score" id="score"></div>
      <div class="nav">
        <button id="q-next" hidden>Next question</button>
      </div>
    </section>
  </main>

  <script>
    var WORDS = [
      // Greetings
      { h: "你好", p: "nǐ hǎo", e: "hello", c: "Greetings" },
      { h: "谢谢", p: "xièxie", e: "thank you", c: "Greetings" },
      { h: "不客气", p: "bú kèqi", e: "you're welcome", c: "Greetings" },
      { h: "再见", p: "zàijiàn", e: "goodbye", c: "Greetings" },
      { h: "对不起", p: "duìbuqǐ", e: "sorry", c: "Greetings" },
      { h: "请", p: "qǐng", e: "please", c: "Greetings" },
      { h: "是", p: "shì", e: "yes / to be", c: "Greetings" },
      { h: "不", p: "bù", e: "no / not", c: "Greetings" },

      // Numbers
      { h: "一", p: "yī", e: "one", c: "Numbers" },
      { h: "二", p: "èr", e: "two", c: "Numbers" },
      { h: "三", p: "sān", e: "three", c: "Numbers" },
      { h: "四", p: "sì", e: "four", c: "Numbers" },
      { h: "五", p: "wǔ", e: "five", c: "Numbers" },
      { h: "六", p: "liù", e: "six", c: "Numbers" },
      { h: "七", p: "qī", e: "seven", c: "Numbers" },
      { h: "八", p: "bā", e: "eight", c: "Numbers" },
      { h: "九", p: "jiǔ", e: "nine", c: "Numbers" },
      { h: "十", p: "shí", e: "ten", c: "Numbers" },

      // Food and drink
      { h: "水", p: "shuǐ", e: "water", c: "Food & drink" },
      { h: "茶", p: "chá", e: "tea", c: "Food & drink" },
      { h: "米饭", p: "mǐfàn", e: "cooked rice", c: "Food & drink" },
      { h: "吃", p: "chī", e: "to eat", c: "Food & drink" },
      { h: "喝", p: "hē", e: "to drink", c: "Food & drink" },

      // Everyday
      { h: "我", p: "wǒ", e: "I / me", c: "Everyday" },
      { h: "你", p: "nǐ", e: "you", c: "Everyday" },
      { h: "他", p: "tā", e: "he / him", c: "Everyday" },
      { h: "她", p: "tā", e: "she / her", c: "Everyday" },
      { h: "人", p: "rén", e: "person", c: "Everyday" },
      { h: "家", p: "jiā", e: "home / family", c: "Everyday" },
      { h: "爱", p: "ài", e: "love", c: "Everyday" },
      { h: "好", p: "hǎo", e: "good", c: "Everyday" },
      { h: "大", p: "dà", e: "big", c: "Everyday" },
      { h: "小", p: "xiǎo", e: "small", c: "Everyday" },
      { h: "猫", p: "māo", e: "cat", c: "Everyday" },
      { h: "狗", p: "gǒu", e: "dog", c: "Everyday" },
      { h: "今天", p: "jīntiān", e: "today", c: "Everyday" }
    ];

    var $ = function (id) { return document.getElementById(id); };

    var deck = [];
    var index = 0;
    var flipped = false;
    var score = 0;
    var asked = 0;
    var current = null;
    var answered = false;

    function shuffled(list) {
      var a = list.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    function buildDeck() {
      var cat = $("category").value;
      deck = WORDS.filter(function (w) { return cat === "All" || w.c === cat; });
      index = 0;
      flipped = false;
      showCard();
      resetQuiz();
    }

    // Flashcards
    function showCard() {
      var w = deck[index];
      $("c-hanzi").textContent = w.h;
      $("c-pinyin").textContent = flipped ? w.p : "";
      $("c-english").textContent = flipped ? w.e : "";
      $("c-hint").hidden = flipped;
      $("progress").textContent = "Card " + (index + 1) + " of " + deck.length;
    }

    function flip() { flipped = !flipped; showCard(); }
    function move(step) {
      index = (index + step + deck.length) % deck.length;
      flipped = false;
      showCard();
    }

    // Quiz
    function resetQuiz() {
      score = 0;
      asked = 0;
      nextQuestion();
    }

    function nextQuestion() {
      answered = false;
      $("q-next").hidden = true;
      current = deck[Math.floor(Math.random() * deck.length)];
      $("q-hanzi").textContent = current.h;
      $("q-pinyin").textContent = current.p;

      var wrong = shuffled(WORDS.filter(function (w) { return w.e !== current.e; })).slice(0, 3);
      var choices = shuffled(wrong.concat([current]));

      var box = $("options");
      box.textContent = "";
      choices.forEach(function (c) {
        var b = document.createElement("button");
        b.textContent = c.e;
        b.addEventListener("click", function () { answer(b, c); });
        box.appendChild(b);
      });
      updateScore();
    }

    function answer(button, choice) {
      if (answered) return;
      answered = true;
      asked++;
      var buttons = $("options").querySelectorAll("button");
      if (choice.e === current.e) {
        score++;
        button.classList.add("right");
      } else {
        button.classList.add("wrong");
        buttons.forEach(function (b) {
          if (b.textContent === current.e) b.classList.add("right");
        });
      }
      updateScore();
      $("q-next").hidden = false;
    }

    function updateScore() {
      $("score").textContent = "Score: " + score + " / " + asked;
    }

    // Tabs
    function setMode(mode) {
      var cards = mode === "cards";
      $("cards").hidden = !cards;
      $("quiz").hidden = cards;
      $("tab-cards").classList.toggle("active", cards);
      $("tab-quiz").classList.toggle("active", !cards);
    }

    // Setup
    (function init() {
      var cats = ["All"];
      WORDS.forEach(function (w) { if (cats.indexOf(w.c) === -1) cats.push(w.c); });
      cats.forEach(function (c) {
        var o = document.createElement("option");
        o.value = c;
        o.textContent = c === "All" ? "All words" : c;
        $("category").appendChild(o);
      });

      $("category").addEventListener("change", buildDeck);
      $("card").addEventListener("click", flip);
      $("card").addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); }
      });
      $("next").addEventListener("click", function () { move(1); });
      $("prev").addEventListener("click", function () { move(-1); });
      $("shuffle").addEventListener("click", function () {
        deck = shuffled(deck);
        index = 0;
        flipped = false;
        showCard();
      });
      $("q-next").addEventListener("click", nextQuestion);
      $("tab-cards").addEventListener("click", function () { setMode("cards"); });
      $("tab-quiz").addEventListener("click", function () { setMode("quiz"); });

      buildDeck();
    })();
  </script>
</body>
</html>
